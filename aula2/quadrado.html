<!doctype html>
<html>
  <head>
    <title>Retângulo</title>
  </head>
  <body>
    <canvas id="meu_canvas" width="200" height="200"></canvas>
    <script>
      // Canvas e contexto
      let canvas = document.getElementById("meu_canvas");
      let context = canvas.getContext("2d");
      // Desenhar um retângulo ou quadrados ( inicio 20/20 e tam 100/100
      context.fillRect(20, 20, 100, 100);
    </script>
  </body>
</html>
