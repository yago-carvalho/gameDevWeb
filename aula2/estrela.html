<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>estrela</title>
  </head>
  <body>
    <canvas id="meu_canvas" width="300" height="300"> </canvas>
    <script>
      //canvas e contexto
      let canvas = document.getElementById("meu_canvas");
      let context = canvas.getContext("2d");

      //iniciar um caminho
      context.beginPath();

      //desenhar uma estrela
      context.moveTo(75, 250);
      context.lineTo(150, 50);
      context.lineTo(225, 250);
      context.lineTo(50, 120);
      context.lineTo(250, 120);
      context.lineTo(75, 250); //ponto final

      //configurar linha
      context.lineWidth = 2;
      context.strokeStyle = "red";

      //traçar as linhas do caminho
      context.stroke();
    </script>
  </body>
</html>
