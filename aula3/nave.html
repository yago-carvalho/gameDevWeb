<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nave</title>
  </head>
  <body>
    <canvas id="meu_canvas" width="500" height="100"></canvas>
    <script>
      // Canvas e contexto
      let canvas = document.getElementById("meu_canvas");
      let context = canvas.getContext("2d");

      // Carregar imagem
      let imagem = new Image();
      imagem.src = "img/nave.jpeg";
      imagem.onload = function () {
        context.drawImage(imagem, 20, 40, 64, 32);
      };
    </script>
  </body>
</html>
