<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nave Loop</title>
  </head>
  <body>
    <canvas id="meu_canvas" width="500" height="100"></canvas>
    <script>
      // Canvas e contexto
      let canvas = document.getElementById("meu_canvas");
      let context = canvas.getContext("2d");

      // Carregar imagem
      let imagem = new Image();
      imagem.src = "img/nave.jpeg";
      imagem.onload = function () {
        // Começar na posição 20
        let x = 20;

        // Desenhar as imagens
        for (let i = 1; i <= 5; i++) {
          context.drawImage(imagem, x, 20, 64, 32);
          x += 70;
        }
      };
    </script>
  </body>
</html>
