<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Métodos save e restore</title>
  </head>
  <body>
    <canvas id="meu_canvas" width="200" height="200"></canvas>
    <script>
      // Canvas e contexto
      let canvas = document.getElementById("meu_canvas");
      let context = canvas.getContext("2d");

      // Um pequeno quadrado verde
      context.fillStyle = "green";
      context.fillRect(50, 50, 25, 25);

      // Salvamos a configuração e subimos na pilha
      context.save();

      // Agora um quadrado roxo
      context.fillStyle = "purple";
      context.fillRect(100, 50, 25, 25);

      // Voltamos para o nível anterior da pilha
      context.restore();

      // Voltou para o verde!
      context.fillRect(150, 50, 25, 25);
    </script>
  </body>
</html>
