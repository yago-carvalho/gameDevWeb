<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Método requestAnimationFrame</title>
  </head>
  <body>
    <canvas id="meu_canvas" width="800" height="300"></canvas>
    <script>
      // Canvas e contexto
      let canvas = document.getElementById("meu_canvas");
      let context = canvas.getContext("2d");

      // Dados da bola
      let x = 20;
      let y = 100;
      let raio = 10;

      // Momento Incial
      let anterior = new Date().getTime();

      // Iniciar a animação
      requestAnimationFrame(mexerBola);

      // Função de animação
      function mexerBola() {
        // Momento atual
        let agora = new Date().getTime();
        // Diferença
        let decorrido = agora - anterior;
        // Limpar o Canvas
        context.clearRect(0, 0, canvas.width, canvas.height);
        // Desenhar a bola
        context.beginPath();
        context.arc(x, y, raio, 0, Math.PI * 2);
        context.fill();
        // Deslocar 20 pixels para a direita
        let velocidade = 100;
        x += (velocidade * decorrido) / 1000;
        // Guardamos o instante para o próximo ciclo
        anterior = agora;
        // Chamar o próximo ciclo da animação
        requestAnimationFrame(mexerBola);
      }
    </script>
  </body>
</html>
