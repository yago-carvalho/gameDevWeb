<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário HTML5</title>
    <link rel="stylesheet" href="style2.css" />
  </head>

  <body>
    <header>
      <h1>Formulário HTML5</h1>

      <p>HTML5 + CSS3 + JavaScript</p>
    </header>

    <main>
      <h2>Cadastro de Aluno</h2>

      <form id="formulario">
        <label for="nome">Nome:</label>
        <input
          type="text"
          id="nome"
          name="nome"
          placeholder="Digite seu nome"
          required
        />

        <label for="email">E-mail:</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="seuemail@email.com"
          required
        />

        <label for="senha">Senha:</label>
        <input
          type="password"
          id="senha"
          name="senha"
          placeholder="Digite sua senha"
          required
        />

        <label for="idade">Idade:</label>
        <input type="number" id="idade" name="idade" min="1" max="120" />

        <label for="nascimento"> Data de nascimento: </label>
        <input type="date" id="nascimento" name="nascimento" />

        <label for="curso">Curso:</label>

        <select id="curso" name="curso">
          <option value="">Selecione um curso</option>
          <option value="ads">Análise e Desenvolvimento de Sistemas</option>
          <option value="cc">Ciência da Computação</option>
          <option value="redes">Redes de Computadores</option>
        </select>

        <fieldset>
          <legend>Turno:</legend>

          <label>
            <input type="radio" name="turno" value="manha" />
            Manhã
          </label>

          <label>
            <input type="radio" name="turno" value="tarde" />
            Tarde
          </label>

          <label>
            <input type="radio" name="turno" value="noite" />
            Noite
          </label>
        </fieldset>

        <fieldset>
          <legend>Áreas de interesse:</legend>

          <label>
            <input type="checkbox" name="interesse" value="html" />
            HTML5
          </label>

          <label>
            <input type="checkbox" name="interesse" value="css" />
            CSS3
          </label>

          <label>
            <input type="checkbox" name="interesse" value="javascript" />
            JavaScript
          </label>

          <label>
            <input type="checkbox" name="interesse" value="games" />
            Games
          </label>
        </fieldset>

        <label for="mensagem"> Mensagem: </label>

        <textarea
          id="mensagem"
          name="mensagem"
          rows="5"
          placeholder="Digite sua mensagem..."
        ></textarea>

        <div class="botoes">
          <button type="submit" class="btn-enviar">Enviar</button>
          <button type="reset" class="btn-limpar">Limpar</button>
        </div>
      </form>

      <!-- ÁREA PARA EXIBIR RESULTADOS -->
      <div id="resultado"></div>
    </main>
    <footer>
      <p>Curso de HTML5 - 2026</p>
    </footer>

    <!-- JAVASCRIPT EXTERNO -->
    <script src="script.js"></script>
  </body>
</html>
