<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orientação a objetos</title>
  </head>
  <body>
    <script>
      function Carro(cor, velocMaxima) {
        // Criando os atributos
        this.cor = cor;
        this.velocMaxima = velocMaxima;
        this.velocAtual = 0;
        // Criando um método
        this.acelerar = function () {
          this.velocAtual = 50;
        };
      }
      // Instanciando objetos da classe Carro
      let meuCarro = new Carro("vermelho", 250);
      let oponente = new Carro("azul", 300);

      // Chamando um método somente em um objeto
      meuCarro.acelerar();

      //Verificando as velocidades
      document.write(
        `Velocidade atual : ${meuCarro.cor} : ${meuCarro.velocAtual}`,
      );
      document.write("<br>");
      document.write(
        `Velocidade máxima : ${meuCarro.cor} : ${meuCarro.velocMaxima}`,
      );
      document.write("<br>");
      document.write(
        `Velocidade atual : ${oponente.cor} : ${oponente.velocAtual}`,
      );
    </script>
  </body>
</html>
