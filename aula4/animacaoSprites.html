<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Primeiro Teste: Loop de Animação com Sprites</title>
    <script src="animacao.js"></script>
    <script src="bola.js"></script>
  </head>

  <body>
    <canvas id="canvas_animacao" width="500" height="500"></canvas>
    <script>
      // Referências para o Canvas
      let canvas = document.getElementById("canvas_animacao");
      let context = canvas.getContext("2d");

      // Criando alguns sprites
      let bola1 = new Bola(context);
      bola1.x = 100;
      bola1.y = 200;
      bola1.velocidadeX = 4;
      bola1.velocidadeY = -3;
      bola1.cor = "red";
      bola1.raio = 20;

      let bola2 = new Bola(context);
      bola2.x = 200;
      bola2.y = 100;
      bola2.velocidadeX = -3;
      bola2.velocidadeY = 5;
      bola2.cor = "blue";
      bola2.raio = 30;

      //Criando o loop de animação
      let animacao = new Animacao(context);
      animacao.novoSprite(bola1);
      animacao.novoSprite(bola2);

      // "Ligar" a animação
      animacao.ligar();
    </script>
  </body>
</html>
